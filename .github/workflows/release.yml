name: Release

# On a pushed tag v<x.y.z>: build, sign with Developer ID, notarize, attach the zip to a GitHub
# release, and write the cask in the Homebrew tap.
#
# Required repository secrets:
#   CODESIGN_P12            base64 of the Developer ID Application .p12 (cert + key)
#   CODESIGN_P12_PASSWORD   the .p12 export password
#   NOTARY_APPLE_ID         Apple ID used for notarization
#   NOTARY_TEAM_ID          the Developer ID team
#   NOTARY_PASSWORD         an app-specific password for that Apple ID
#   TAP_TOKEN               PAT with push access to the Homebrew tap repo
# Required repository variable:
#   TAP_REPO                the tap repo, e.g. <owner>/homebrew-tap

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          CODESIGN_P12: ${{ secrets.CODESIGN_P12 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "$CODESIGN_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CODESIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          rm cert.p12

      - name: Save notary credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials openatk \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --keychain "$KEYCHAIN"

      - name: Build, sign, notarize
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" macos/Resources/Info.plist
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          test -n "$IDENTITY" || { echo "no Developer ID Application identity in keychain"; exit 1; }
          OPENATK_RELEASE_IDENTITY="$IDENTITY" \
            OPENATK_NOTARY_PROFILE=openatk \
            OPENATK_NOTARY_KEYCHAIN="$KEYCHAIN" \
            macos/scripts/package_release.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "macos/build/openatk-$VERSION.zip" --generate-notes

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_REPO: ${{ vars.TAP_REPO }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "macos/build/openatk-$VERSION.zip" | awk '{print $1}')
          HOMEPAGE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          URL="${HOMEPAGE}/releases/download/v${VERSION}/openatk-${VERSION}.zip"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          sed -e "s|@VERSION@|${VERSION}|" \
            -e "s|@SHA256@|${SHA}|" \
            -e "s|@URL@|${URL}|" \
            -e "s|@HOMEPAGE@|${HOMEPAGE}|" \
            macos/packaging/openatk.rb.template > tap/Casks/openatk.rb
          cd tap
          git add Casks/openatk.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "openatk ${VERSION}"
          git push
