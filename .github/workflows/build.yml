name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Build
        run: macos/scripts/build_app.sh
      - name: Test
        run: |
          cargo test
          cargo test -p openatk-core --example settings_tool
          swift test --package-path macos
