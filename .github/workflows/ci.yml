name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust checks
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo test -p openatk-core --example settings_tool

      - name: Swift tests
        run: |
          macos/scripts/build_rust.sh
          swift test --package-path macos
