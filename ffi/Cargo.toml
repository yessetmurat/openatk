[package]
name = "openatk-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "openatk_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"

[dependencies]
openatk-core = { path = "../core" }
uniffi = { version = "0.32", features = ["cli"] }

[lints]
workspace = true
